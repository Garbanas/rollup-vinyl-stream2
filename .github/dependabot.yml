version: 2
updates:
  # Covers pnpm too (it reads pnpm-lock.yaml). Dependabot also reads minimumReleaseAge
  # from pnpm-workspace.yaml, but uses this cooldown when it is at least as strict;
  # keep both at 3 days so the setting is visible here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major updates of runtime dependencies may drop Node versions that
      # users of 1.x still run, so they need a deliberate major release.
      - dependency-name: through2
        update-types: ["version-update:semver-major"]
      - dependency-name: vinyl
        update-types: ["version-update:semver-major"]
      - dependency-name: vinyl-sourcemaps-apply
        update-types: ["version-update:semver-major"]
      - dependency-name: require-from-string
        update-types: ["version-update:semver-major"]
      # The tested Rollup majors are defined by peerDependencies and the CI matrix
      - dependency-name: rollup
        update-types: ["version-update:semver-major"]
      # chai 5+ is ESM-only
      - dependency-name: chai
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # No pnpm setting covers Actions, so this cooldown is the only release-age check here
    cooldown:
      default-days: 3
