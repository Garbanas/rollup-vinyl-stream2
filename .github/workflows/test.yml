name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / rollup ${{ matrix.rollup }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
        # 1.16.6 is the lowest version allowed by peerDependencies
        rollup: ['1.16.6', '1', '2', '3', '4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Changes package.json and the lockfile in this job only; the supply-chain
      # settings in pnpm-workspace.yaml still apply to what it installs
      - name: Install rollup@${{ matrix.rollup }}
        run: pnpm add --save-dev rollup@${{ matrix.rollup }}
      - run: node -p "'rollup ' + require('rollup').VERSION"
      - run: pnpm test

  syntax:
    name: ES2015 syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # index.js must keep running on the old Node versions users still have
      - run: pnpm run check:syntax

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, syntax]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        run: |
          echo "test: ${{ needs.test.result }}, syntax: ${{ needs.syntax.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.syntax.result }}" = "success" ]
